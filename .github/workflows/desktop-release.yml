name: desktop-release

# Триггерится на git tag v* — собирает Windows installer и публикует в GitHub Releases.
#
# Использование:
#   git tag v2.0.1 && git push origin v2.0.1
#
# CI делает:
#   1. Cross-compile Go-binary под windows/amd64
#   2. Build Vite frontend
#   3. Packing с electron-builder → NSIS installer
#   4. Upload в Release (создаёт release если ещё нет)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # v2.6.1 fix: order changed — frontend нужно собрать ПЕРЕД Go build.
      # Раньше Go build был первым → бинарь содержал spa/index.html placeholder
      # → browser на :3001 видел "Frontend assets are not embedded".
      # Теперь: pnpm install → vite build → copy в server/internal/transport/http/spa
      # → ТОЛЬКО ПОТОМ go build embed'ит реальный SPA через //go:embed all:spa.

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Embed SPA into Go server tree
        shell: bash
        run: |
          rm -rf server/internal/transport/http/spa
          mkdir -p server/internal/transport/http/spa
          cp -r dist/. server/internal/transport/http/spa/
          ls -lh server/internal/transport/http/spa/ | head -10

      - name: Copy frontend into desktop/
        shell: bash
        run: |
          rm -rf desktop/frontend
          cp -r dist desktop/frontend

      - name: Build Go sidecar (windows/amd64) with embedded SPA
        working-directory: server
        shell: bash
        run: |
          mkdir -p ../desktop/resources
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" \
            -o ../desktop/resources/restos-server.exe ./cmd/restos-server
          ls -lh ../desktop/resources/

      # Бандлим клиентские утилиты pg_dump/pg_restore (PG16) + их DLL в
      # desktop/resources. Embedded-postgres (zonky) кладёт только серверные
      # бинари (initdb/pg_ctl/postgres), а раннер GitHub имеет старый PG14
      # (pg_dump 14 не сдампит сервер PG16). Поэтому тянем EDB PG16-бинари.
      # main.js передаёт RESTOS_PG_DUMP_PATH=resources/pg_dump.exe, а backup.go
      # добавляет resources в PATH для DLL — см. service/backup.go.
      - name: Bundle PostgreSQL 16 client tools (pg_dump/pg_restore + DLLs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://get.enterprisedb.com/postgresql/postgresql-16.6-1-windows-x64-binaries.zip'
          Invoke-WebRequest -Uri $url -OutFile pg.zip
          Expand-Archive -Path pg.zip -DestinationPath pgdist -Force
          $bin = Join-Path (Join-Path 'pgdist' 'pgsql') 'bin'
          New-Item -ItemType Directory -Force -Path 'desktop/resources' | Out-Null
          Copy-Item (Join-Path $bin 'pg_dump.exe')    'desktop/resources/' -Force
          Copy-Item (Join-Path $bin 'pg_restore.exe') 'desktop/resources/' -Force
          Copy-Item (Join-Path $bin '*.dll')          'desktop/resources/' -Force
          if (-not (Test-Path 'desktop/resources/pg_dump.exe')) { throw 'pg_dump.exe not bundled' }
          Get-ChildItem 'desktop/resources' | Select-Object Name, Length

      - name: Install desktop deps
        working-directory: desktop
        run: npm install --no-save

      - name: Pack Windows NSIS installer + publish to release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish=always

      # electron-builder создаёт release в draft-mode. Снимаем флаг чтобы
      # auto-updater клиентов сразу его подхватил. Без этого приходилось
      # вручную жать "Publish" на каждом релизе.
      - name: Promote draft → published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Publishing $TAG"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
