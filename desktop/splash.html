<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f3f0;
      color: #1c1917;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box { text-align: center; padding: 40px; }
    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      background: #d85a30;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(216, 90, 48, 0.30);
      animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .logo svg { width: 48px; height: 48px; color: #fff; }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #78716c;
      font-size: 14px;
      font-weight: 500;
      margin-top: 14px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(216, 90, 48, 0.25);
      border-top-color: #d85a30;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint {
      color: #a8a29e;
      font-size: 12.5px;
      margin-top: 26px;
      max-width: 320px;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .hint.show { opacity: 1; }
    .ver {
      position: fixed;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      color: #c7c2bc;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">
      <!-- ChefHat (lucide) — как логотип в приложении -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
        <line x1="6" y1="17" x2="18" y2="17"/>
      </svg>
    </div>
    <h1>RestOS</h1>
    <div class="sub"><span class="spinner"></span><span>Запускаем сервер…</span></div>
    <div class="hint" id="hint">Первый запуск может занять до минуты — распаковывается база данных. Дальше касса будет открываться мгновенно.</div>
  </div>
  <div class="ver" id="ver"></div>

  <script>
    // Подсказку про первый запуск показываем не сразу — только если старт
    // затянулся (обычный запуск быстрый, лишний текст не мелькает).
    setTimeout(function () {
      var h = document.getElementById('hint');
      if (h) h.classList.add('show');
    }, 8000);
    try {
      var v = (window.restosDesktop && window.restosDesktop.version) || '';
      if (v) document.getElementById('ver').textContent = 'v' + v;
    } catch (e) {}
  </script>
</body>
</html>
