      responses: { "200": { $ref: "#/components/responses/XLSX" } }
  /api/v1/analytics/insights:
    get:
      tags: [analytics]
      summary: Инсайты — ранжированные действия (кросс-аналитика меню/утечек/склада/персонала)
      parameters: [ { $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/InsightsReport" } } } } }
  /api/v1/waiter-app:
    get:
      tags: [settings]
      summary: Состояние APK официанта (есть ли, версия, размер, дата)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WaiterAppInfo" } } } } }
    post:
      tags: [settings]
      summary: Загрузить новый APK официанта (multipart "file", optional "version")
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                version: { type: string }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WaiterAppInfo" } } } } }
  /download/waiter.apk:
    get:
      tags: [settings]
      summary: Публичное скачивание APK официанта (по QR в LAN, без авторизации)
      responses:
        "200": { description: APK файл, content: { application/vnd.android.package-archive: { schema: { type: string, format: binary } } } }
        "404": { description: APK ещё не загружен }
  /api/v1/analytics/forecast:
    get:
      tags: [analytics]
      summary: Прогноз выручки + break-even + linreg next month
      parameters: [ { $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ForecastReport" } } } } }
  /api/v1/analytics/abc-inventory:
    get:
      tags: [analytics]
      summary: ABC ингредиентов по value расхода + days_of_stock
      parameters: [ { $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ABCInventoryReport" } } } } }

  # ─── Finance: Payroll & service charge ──────────────────────────────────
  /api/v1/finance/salary/pay:
    post:
      tags: [finance, payroll]
      summary: Выплата ЗП (FinancialOperation type=out + декремент счёта в tx)
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SalaryPayInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialOperation" } } } } }
  /api/v1/finance/accounts/balance-history:
    get:
      tags: [finance]
      summary: Остаток по счетам на каждый день периода
      description: >
        История остатков восстанавливается обратным ходом от текущего баланса
        (financial_accounts.balance — скаляр «сейчас», таблицы снимков нет):
        closing(D) = balance_now − Σ(приход − расход) за все дни после D.
        Период ограничен 400 днями.
      parameters:
        - { in: query, name: from, schema: { type: string }, description: "YYYY-MM-DD, по умолчанию 30 дней назад" }
        - { in: query, name: to, schema: { type: string }, description: "YYYY-MM-DD, по умолчанию сегодня" }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AccountBalanceHistory" } } } } }
  /api/v1/finance/salary/accrual:
    get:
      tags: [finance, payroll]
      summary: Начислено за период по сотрудникам
      description: >
        Для оклада (pay_type=monthly) — сумма из карточки, от периода не зависит.
        Для дневной оплаты (daily) — daily_rate × число дней с отметкой в табеле:
        день считается отработанным, если в нём есть хотя бы одна отметка прихода
        (две отметки в один день = один день).
      parameters:
        - { in: query, name: from, schema: { type: string }, description: "YYYY-MM-DD включительно" }
        - { in: query, name: to, schema: { type: string }, description: "YYYY-MM-DD включительно" }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/SalaryAccrualRow" } } } } } } } }
  /api/v1/finance/salary/worked-days:
    get:
      tags: [finance, payroll]
      summary: Отработанные дни сотрудника (табель + ручные отметки) за период
      parameters:
        - { in: query, name: user_id, schema: { type: string } }
        - { in: query, name: from, schema: { type: string }, description: "YYYY-MM-DD включительно" }
        - { in: query, name: to, schema: { type: string }, description: "YYYY-MM-DD включительно" }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkedDaysResult" } } } } }
    put:
      tags: [finance, payroll]
      summary: Заменить ручные отметки дней сотрудника в периоде
      description: >
        Идемпотентно заменяет РУЧНЫЕ отметки (salary_worked_days) в [from, to] на
        переданный набор dates. Табель (реальные приходы) не трогает.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                from: { type: string }
                to: { type: string }
                dates: { type: array, items: { type: string } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorkedDaysResult" } } } } }
  /api/v1/finance/salary/report:
    get:
      tags: [finance, payroll]
      summary: Отчёт по зарплате — кому сколько выдали и когда
      description: >
        Агрегация financial_operations категорий «Зарплата», «Аванс» и «Сервис»
        за период: сводка по сотрудникам + плоский список выплат со счётом.
      parameters:
        - { in: query, name: from, schema: { type: string }, description: "YYYY-MM-DD включительно" }
        - { in: query, name: to, schema: { type: string }, description: "YYYY-MM-DD включительно" }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SalaryReport" } } } } }
  /api/v1/finance/service-charge/pay:
    post:
      tags: [finance, payroll]
      summary: Выплата сервис-чарджа официанту
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceChargePayInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialOperation" } } } } }
  /api/v1/finance/service-accrual/by-waiter:
    get:
      tags: [finance, payroll]
      summary: Начисление сервис-чарджа по официантам за период
      parameters: [ { $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccrualList" } } } } }
  /api/v1/finance/service-accrual/by-shift/{shift_id}:
    get:
      tags: [finance, payroll]
      summary: Начисление сервис-чарджа по официантам в смене
      parameters: [ { in: path, name: shift_id, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceAccrualList" } } } } }
  /api/v1/finance/service-payout/by-waiter:
    get:
      tags: [finance, payroll]
      summary: Выплаты сервис-чарджа по официантам за период
      parameters: [ { $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePayoutList" } } } } }
  /api/v1/finance/service-payout/by-shift/{shift_id}:
    get:
      tags: [finance, payroll]
      summary: Выплаты сервис-чарджа по официантам в смене
      parameters: [ { in: path, name: shift_id, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePayoutList" } } } } }

  # ─── Phase 14: cutover extras ───────────────────────────────────────────
  /api/v1/shifts/active:
    get:
      tags: [shifts]
      summary: Текущая open-смена (404 если нет)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CashShift" } } } }
        "404": { description: Not Found }

  /api/v1/shifts/{id}/zreport:
    get:
      tags: [shifts]
      summary: Z-отчёт смены (JSON, агрегаты + ops + revenue_by_method)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift: { type: object }
                  revenue_by_method: { type: array, items: { type: object } }
                  sales_by_waiter: { type: array, items: { type: object } }
                  sales_by_category: { type: array, items: { type: object } }
                  sales_by_item: { type: array, items: { type: object } }
                  sales_by_order_type: { type: array, items: { type: object } }
                  guests_count: { type: integer }
                  operations: { type: array, items: { $ref: "#/components/schemas/CashShiftOperation" } }
                  discrepancy: { type: string }
                  cash_in: { type: string, description: "Внесения за смену" }
                  withdrawals: { type: string, description: "Изъятия (cash_out без категории)" }
                  expenses_total: { type: string, description: "Сумма расходов (cash_out с категорией)" }
                  expenses_by_category:
                    type: array
                    items:
                      type: object
                      properties:
                        category: { type: string }
                        count: { type: integer }
                        amount: { type: string }
                  refunds_total: { type: string, description: "Сумма возвратов покупателям за смену (нал+безнал)" }
                  refunds_count: { type: integer, description: "Количество возвратов (чеков) за смену" }
                  previous:
                    type: object
                    nullable: true
                    properties:
                      revenue: { type: string }
                      orders_count: { type: integer }
                      avg_check: { type: string }
                      guests_count: { type: integer }
                      closed_at: { type: string, format: date-time, nullable: true }

  /api/v1/shifts/{id}/print-z:
    post:
      tags: [shifts]
      summary: Печать Z-отчёта смены на receipt-принтер
      description: |
        Создаёт PrintJob type='z_report' с готовым ESC/POS payload.
        Реальная отправка — асинхронным воркером очереди.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { type: string }

  /api/v1/shifts/{id}/print-x:
    post:
      tags: [shifts]
      summary: Печать промежуточного X-отчёта (без обнуления)
      description: |
        Аналог print-z, но layout — X-отчёт (без секции «Расхождение»).
        Может вызываться при открытой смене.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { type: string }

  /api/v1/shifts/{id}/print-service:
    post:
      tags: [shifts]
      summary: Печать чека «Обслуживание официантов» за смену
      description: |
        Создаёт PrintJob type='service_report' с ESC/POS payload: по каждому
        официанту начислено (service_amount), выплачено, к выплате + итоги.
        Кнопка рядом с X/Z-отчётом. Работает при открытой и закрытой смене.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { type: string }

  /api/v1/shifts/{id}/revenue:
    get:
      tags: [shifts]
      summary: Денормализованная статистика смены (cash, card, count, avg)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: OK } }

  /api/v1/shifts/{id}/operations-list:
    get:
      tags: [shifts]
      summary: Список операций смены (без header'а) — реальный путь /shifts/{id}/operations (GET)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: OK } }

  /api/v1/shifts/{id}/expenses:
    post:
      tags: [shifts]
      summary: Внести cash_in/cash_out/expense (alias к cash_out)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount]
              properties:
                type: { type: string, enum: [cash_in, cash_out, expense] }
                amount: { type: string }
                description: { type: string }
                category: { type: string, description: "Категория расхода (только для expense/cash_out). Структурное поле для свода/экспорта/X-Z." }
                account_id: { type: string, format: uuid, description: "Счёт расхода. Пусто → счёт смены (наличный). id банк-счёта → безналичный расход: дебетует его, наличный ящик не трогает." }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CashShiftOperation" } } } } }

  /api/v1/shifts/{id}/expenses/{op_id}:
    delete:
      tags: [shifts]
      summary: Удалить cash-операцию (только если смена открыта)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: op_id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: No Content }
        "404": { description: Not Found }
        "409": { description: Shift not open }
  /api/v1/cash-shift-operations/{op_id}:
    delete:
      tags: [shifts]
      summary: "Удалить cash-операцию по ID (сервер сам резолвит shift_id, проверяет статус смены)"
      parameters:
        - { in: path, name: op_id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: No Content }
        "404": { description: Not Found }
        "409": { description: Shift not open }

  /api/v1/stop-list:
    get:
      tags: [menu]
      summary: Стоп-лист (auto + manual), compute-on-read
      responses: { "200": { description: OK } }

  /api/v1/stop-list/{menu_item_id}/override:
    post:
      tags: [menu]
      summary: Поставить/снять manual stop_list_override
      parameters:
        - { in: path, name: menu_item_id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override]
              properties: { override: { type: boolean } }
      responses: { "200": { description: OK } }

  /api/v1/stop-list/recompute:
    post:
      tags: [menu]
      summary: No-op (FE-совместимость; v4 считает on-read)
      parameters: [ $ref: "#/components/parameters/IdempotencyKey" ]
      responses: { "200": { description: OK } }

  /api/v1/semi/prepare:
    post:
      tags: [semi]
      summary: Произвести N единиц полуфабриката из рецепта
      parameters: [ $ref: "#/components/parameters/IdempotencyKey" ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [semi_type_id, qty]
              properties:
                semi_type_id: { type: string, format: uuid }
                qty: { type: string }
                prepared_by: { type: string }
      responses: { "200": { description: OK } }

  /api/v1/semi/consume:
    post:
      tags: [semi]
      summary: Списать N единиц полуфабриката
      parameters: [ $ref: "#/components/parameters/IdempotencyKey" ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [semi_type_id, qty]
              properties:
                semi_type_id: { type: string, format: uuid }
                qty: { type: string }
                order_id: { type: string, format: uuid }
      responses: { "200": { description: OK } }

  /api/v1/menu/items/{id}/max-portions:
    get:
      tags: [menu]
      summary: Сколько порций можно приготовить прямо сейчас
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  max: { type: integer, description: "Макс. порций по остатку. Большой sentinel (MaxInt32) = рецепта нет." }
                  has_recipe: { type: boolean, description: "Есть ли тех-карта (хотя бы одна строка)." }
                  ingredients:
                    type: array
                    items:
                      type: object
                      properties:
                        ingredient_id: { type: string, format: uuid }
                        name: { type: string }
                        unit: { type: string, description: "единица склада (кг, л, шт)" }
                        recipe_unit: { type: string, description: "единица расхода в тех-карте (г, мл)" }
                        stock_qty: { type: string, description: "остаток (в единице склада)" }
                        recipe_qty_per_portion: { type: string, description: "расход на 1 порцию (в единице тех-карты)" }
                        stock_qty_per_portion: { type: string, description: "расход на 1 порцию, приведённый к единице склада" }
                        possible_portions: { type: integer }
                        is_bottleneck: { type: boolean }
                  blockers:
                    type: array
                    items:
                      type: object
                      properties:
                        ingredient_id: { type: string, format: uuid }
                        name: { type: string }
                        have: { type: string }
                        need: { type: string }

  /api/v1/menu/batch/availability:
    get:
      tags: [menu]
      summary: Живой остаток порций заготовок (prepared − незакрытые заказы)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        menu_item_id: { type: string, format: uuid }
                        name: { type: string }
                        prepared: { type: integer, description: "prepared_qty (готово на складе)" }
                        reserved: { type: integer, description: "порции в незакрытых заказах" }
                        available: { type: integer, description: "max(0, prepared - reserved)" }

  /api/v1/menu/items/{id}/batch/produce:
    post:
      tags: [menu]
      summary: Партионная готовка — произвести N порций (списать ингредиенты)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: integer, minimum: 1 }
                prepared_by: { type: string }
      responses: { "200": { description: OK } }

  /api/v1/menu/items/{id}/batch/decrement:
    post:
      tags: [menu]
      summary: Декремент prepared_qty (без списания ингредиентов)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qty: { type: integer, minimum: 1, default: 1 }
                order_id: { type: string, format: uuid }
      responses: { "200": { description: OK } }

  /api/v1/menu/items/{id}/batch/writeoff:
    post:
      tags: [menu]
      summary: Списать партию (целиком или N порций)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qty: { type: integer, minimum: 1 }
                reason: { type: string }
      responses: { "200": { description: OK } }

  /api/v1/menu/items/{id}/batch/logs:
    get:
      tags: [menu]
      summary: История партионной готовки
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses: { "200": { description: OK } }
  /api/v1/menu/batch/logs:
    get:
      tags: [menu]
      summary: История партионной готовки (по всем items)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses: { "200": { description: OK } }

  /api/v1/audit-log:
    get:
      tags: [admin]
      summary: Audit log с фильтрами + offset-пагинация
      parameters:
        - { in: query, name: entity_type, schema: { type: string } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: user_id, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses: { "200": { description: OK } }

  /api/v1/print/jobs/{id}/reprint:
    post:
      tags: [print_jobs]
      summary: Перепечатка — клонирует job с новым id, status='pending'
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses: { "201": { description: Created } }

  /api/v1/print/jobs/active-by-station:
    get:
      tags: [print_jobs]
      summary: Pending jobs для станции (для KDS)
      parameters:
        - { in: query, name: station, required: true, schema: { type: string } }
      responses: { "200": { description: OK } }

  /api/v1/reservations/for-table/{table_id}:
    get:
      tags: [admin]
      summary: Брони на конкретный стол в диапазоне (default = next 12h)
      parameters:
        - { in: path, name: table_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses: { "200": { description: OK } }

  /api/v1/time-entries/active:
    get:
      tags: [payroll]
      summary: Текущая открытая запись для пользователя (404 если нет)
      parameters:
        - { in: query, name: user_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } } }
        "404": { description: Not Found }

  /api/v1/time-entries/{id}:
    patch:
      tags: [payroll]
      summary: Manual edit time entry (manager)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clock_in:  { type: string, format: date-time }
                clock_out: { type: string, format: date-time }
                role:      { type: string }
                note:      { type: string }
      responses: { "200": { description: OK } }
    delete:
      tags: [payroll]
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses: { "204": { description: No content } }

  /api/v1/waiters/{id}/today-stats:
    get:
      tags: [payroll]
      summary: Стата официанта за сегодня (orders/served/revenue/hours)
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: OK } }

  # ─── SSE ────────────────────────────────────────────────────────────────
  /api/v1/events:
    get:
      tags: [events]
      summary: SSE-поток (order.*, shift.*, stock.movement, license.updated, hello, ping)
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

# ═══════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  parameters:
    Limit:
      in: query
      name: limit
      schema: { type: integer, default: 50, maximum: 200 }
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
      description: base64url-token из next_cursor предыдущего ответа
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, format: uuid }
      description: UUID, обязателен для всех write-операций (auto-added by client middleware)
    From: { in: query, name: from, schema: { type: string, format: date-time } }
    To:   { in: query, name: to,   schema: { type: string, format: date-time } }

  responses:
    OK:
      description: OK
      content: { application/json: { schema: { type: object } } }
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    XLSX:
      description: XLSX file
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, format: binary }
      headers:
        Content-Disposition:
          schema: { type: string }
          description: attachment; filename="..."

  # ───── schemas ─────
  schemas:
    KDSItem:
      type: object
      description: Блюдо на кухонной доске (одна карточка KDS).
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        order_number: { type: integer }
        order_type: { type: string, description: "hall/takeaway/delivery" }
        table_number: { type: integer, nullable: true }
        table_name: { type: string, nullable: true }
        name: { type: string }
        qty: { type: string, description: "decimal" }
        unit: { type: string, description: "g/kg = весовое (qty — вес); piece/пусто = штучное" }
        comment: { type: string, nullable: true }
        station: { type: string }
        station_status: { type: string, enum: [pending, cooking, ready, served] }
        waiter_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        age_seconds: { type: integer, description: "Возраст блюда в секундах по часам сервера (для таймера кухни)" }
        status_at: { type: string, format: date-time, nullable: true }

    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "Стабильный машинно-читаемый код" }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    SessionInfo:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        restaurant_id: { type: string, format: uuid }
        user_name: { type: string }
        role: { type: string }
        expires_at: { type: string, format: date-time }

    LicenseStatus:
      type: object
      properties:
        state: { type: string, enum: [none, active, grace, warning, locked] }
        expires_at: { type: string, format: date-time }
        days_left: { type: integer }
        days_until_lock: { type: integer }
        is_blocked: { type: boolean }
        block_reason: { type: string }
        edition: { type: string, enum: [start, business, pro] }
        grace_days: { type: integer, description: "Per-key grace дней (warning). v2.1.3+." }
        warning_days: { type: integer, description: "Per-key warning дней (lock). v2.1.3+." }

    Decimal: { type: string, description: "NUMERIC(14,4) как строка ('123.45')" }

    # ─── Menu ──
    MenuItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        price: { $ref: "#/components/schemas/Decimal" }
        emoji: { type: string }
        is_available: { type: boolean }
        station: { type: string }
        cogs: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        unit_size: { $ref: "#/components/schemas/Decimal" }
        sale_step: { $ref: "#/components/schemas/Decimal" }
        low_stock_threshold: { type: integer }
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Задан у сгенерированных вариантов; NULL у обычных блюд и продуктов.
    MenuItemInput:
      type: object
      properties:
        name: { type: string }
        category: { type: string }
        price: { $ref: "#/components/schemas/Decimal" }
        emoji: { type: string }
        is_available: { type: boolean }
        station: { type: string }
        cogs: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        unit_size: { $ref: "#/components/schemas/Decimal" }
    MenuItemWithExtras:
      allOf:
        - $ref: "#/components/schemas/MenuItem"
        - type: object
          properties:
            tech_card_lines:
              type: array
              description: |
                Всегда присутствует (пустой массив, если не запрошен через
                `?include=tech_cards`). Это уменьшает type-ветвление на фронте.
              items: { $ref: "#/components/schemas/TechCardLine" }
            attributes:
              type: array
              description: Атрибуты продукта (только с `?include=attributes`).
              items: { $ref: "#/components/schemas/MenuAttributeWithValues" }
            variant_value_ids:
              type: array
              description: Значения комбинации варианта (только с `?include=attributes`).
              items: { type: string, format: uuid }
    IngredientPrice:
      type: object
      properties:
        price: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        waste_percent: { $ref: "#/components/schemas/Decimal" }
        unit_weight: { $ref: "#/components/schemas/Decimal" }
        unit_weight_unit: { type: string }
    SemiPrice:
      type: object
      description: |
        Себестоимость полуфабриката за единицу (для строк тех-карты с
        `semi_type_id`). Источник — semi_finished_stock.price_per_unit
        (yield п/ф уже зашит в цену). Используется в расчёте с/с блюда.
      properties:
        price: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
    MenuItemsList:
      type: object
      description: |
        Универсальный envelope для /menu/items. Поля `tech_card_lines`
        (per-item) и `ingredient_prices` (top-level) всегда присутствуют:
        пустые, если соответствующий `include` не задан.

        `?include=tech_cards` — заполняет `tech_card_lines` для каждого блюда
        (одним batch-SELECT'ом, не N+1).

        `?include=tech_cards,ingredient_prices` — дополнительно подгружает цены
        ингредиентов из tech card lines в top-level `ingredient_prices`, а также
        себестоимость полуфабрикатов (по `semi_type_id`) в `semi_prices` —
        нужна для корректного расчёта с/с блюд, собранных из п/ф.
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MenuItemWithExtras" }
        ingredient_prices:
          type: object
          additionalProperties: { $ref: "#/components/schemas/IngredientPrice" }
        semi_prices:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SemiPrice" }
        next_cursor: { type: string }

    MenuAttribute:
      type: object
      properties:
        id: { type: string, format: uuid }
        menu_item_id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        size_scale_id: { type: string, format: uuid, nullable: true, description: "Если задан — значения зеркалятся из шкалы размеров, а не вводятся вручную." }
    MenuAttributeValue:
      type: object
      properties:
        id: { type: string, format: uuid }
        attribute_id: { type: string, format: uuid }
        label: { type: string }
        sort_order: { type: integer }
        size_scale_value_id: { type: string, format: uuid, nullable: true, description: "Какое значение шкалы (SizeScaleValue) зеркалит эта строка." }
    MenuAttributeWithValues:
      allOf:
        - $ref: "#/components/schemas/MenuAttribute"
        - type: object
          properties:
            values:
              type: array
              items: { $ref: "#/components/schemas/MenuAttributeValue" }
    MenuVariant:
      allOf:
        - $ref: "#/components/schemas/MenuItem"
        - type: object
          properties:
            value_ids:
              type: array
              items: { type: string, format: uuid }
    ProductAttributesState:
      type: object
      properties:
        attributes:
          type: array
          items: { $ref: "#/components/schemas/MenuAttributeWithValues" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/MenuVariant" }
    SyncAttributesInput:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: array
          description: Порядок массива = sort_order. id опущен → создать.
          items:
            type: object
            required: [name, values]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              size_scale_id: { type: string, format: uuid, description: "Если задан — values должен быть пустым: значения зеркалятся из шкалы размеров." }
              values:
                type: array
                items:
                  type: object
                  required: [label]
                  properties:
                    id: { type: string, format: uuid }
                    label: { type: string }
        combos:
          type: array
          description: |
            Цены комбинаций: labels — лейблы значений в порядке атрибутов.
            Каждая комбинация декартова произведения обязана получить цену > 0.
          items:
            type: object
            required: [labels, price]
            properties:
              labels:
                type: array
                items: { type: string }
              price: { $ref: "#/components/schemas/Decimal" }
              purchase_price: { $ref: "#/components/schemas/Decimal" }

    MenuCategory:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string }, sort_order: { type: integer } }
    MenuCategoriesList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/MenuCategory" } } } }

    SizeScale:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SizeScaleValue:
      type: object
      properties:
        id: { type: string, format: uuid }
        size_scale_id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string, nullable: true }
        sort_order: { type: integer }
        is_default: { type: boolean }
    SizeScaleWithValues:
      allOf:
        - $ref: "#/components/schemas/SizeScale"
        - type: object
          properties:
            values:
              type: array
              items: { $ref: "#/components/schemas/SizeScaleValue" }
    SizeScaleInput:
      type: object
      properties:
        name: { type: string }
        values:
          type: array
          description: Если передан — полностью заменяет текущие значения шкалы (delete+recreate).
          items:
            type: object
            required: [code]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              title: { type: string }
              sort_order: { type: integer }
              is_default: { type: boolean }
    SizeScalesList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/SizeScaleWithValues" } } } }

    # ─── Floor ──
    Zone: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, sort_order: { type: integer } } }
    ZoneInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
    ZonesList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Zone" } } } }
    Table:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        capacity: { type: integer }
        zone_id: { type: string, format: uuid }
        status: { type: string, enum: [free, occupied, reserved, dirty] }
    TablesList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Table" } } } }
    Warehouse: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, kind: { type: string, enum: [products, purchased, supplies] }, restaurant_id: { type: string } } }
    WarehousesList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Warehouse" } } } }
    WarehouseTransferInput: { type: object, required: [ingredient_id, to_warehouse_id], properties: { ingredient_id: { type: string, format: uuid }, to_warehouse_id: { type: string, format: uuid } } }
    TableInput:
      type: object
      properties:
        name: { type: string }
        number: { type: integer }
        capacity: { type: integer }
        zone_id: { type: string, format: uuid }
        status: { type: string, enum: [free, occupied, reserved, dirty, merged] }
        current_order_id: { type: string }
        waiter_id: { type: string }
        opened_at: { type: string, format: date-time }

    # ─── Stock ──
    Ingredient:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        qty: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        min_qty: { $ref: "#/components/schemas/Decimal" }
        price_per_unit: { $ref: "#/components/schemas/Decimal" }
        unit_weight: { $ref: "#/components/schemas/Decimal" }
        unit_weight_unit: { type: string }
    IngredientsList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Ingredient" } }, next_cursor: { type: string } } }
    IngredientInput:
      type: object
      properties:
        name: { type: string }
        category: { type: string }
        qty: { $ref: "#/components/schemas/Decimal" }
        min_qty: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        price_per_unit: { $ref: "#/components/schemas/Decimal" }
        waste_percent: { $ref: "#/components/schemas/Decimal" }
        unit_weight: { $ref: "#/components/schemas/Decimal" }
        unit_weight_unit: { type: string }
        is_food: { type: boolean }
    StringList: { type: object, properties: { data: { type: array, items: { type: string } } } }
    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        ingredient_id: { type: string, format: uuid }
        ingredient_name: { type: string }
        qty: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        description: { type: string }
        warehouse_id: { type: string, format: uuid, nullable: true, description: "Склад движения (мультисклад)" }
        created_at: { type: string, format: date-time }
    StockMovementsList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }, next_cursor: { type: string } } }
    StockReceiptsList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/StockReceipt" } }, next_cursor: { type: string } } }
    StockReturnsList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/StockReturn" } }, next_cursor: { type: string } } }
    StockWriteoffsList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/StockWriteoff" } }, next_cursor: { type: string } } }
    InventoryChecksList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/InventoryCheck" } }, next_cursor: { type: string } } }
    InventoryCheckLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        check_id: { type: string, format: uuid }
        ingredient_id: { type: string, format: uuid }
        ingredient_name: { type: string }
        unit: { type: string }
        system_qty: { $ref: "#/components/schemas/Decimal" }
        actual_qty: { $ref: "#/components/schemas/Decimal" }
        diff: { $ref: "#/components/schemas/Decimal" }
    InventoryCheckLinesList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/InventoryCheckLine" } } } }
    SupplyExpense:
      type: object
      properties:
        id: { type: string, format: uuid }
        ingredient_id: { type: string, format: uuid }
        ingredient_name: { type: string }
        qty: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        reason: { type: string }
        issued_to: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }
    SupplyExpensesList: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/SupplyExpense" } }, next_cursor: { type: string } } }
    SupplyExpenseInput:
      type: object
      required: [ingredient_id, qty]
      properties:
        ingredient_id: { type: string, format: uuid }
        qty: { $ref: "#/components/schemas/Decimal" }
        unit: { type: string }
        reason: { type: string }
        issued_to: { type: string }
        note: { type: string }

    ReceiptInput:
      type: object
      required: [payment_type, lines]
      properties:
        supplier_id: { type: string, format: uuid }
        supplier_name: { type: string }
        date: { type: string }
        note: { type: string }
        payment_type: { type: string, enum: [paid, credit] }
        paid_amount: { $ref: "#/components/schemas/Decimal" }
        due_date: { type: string }
        account_id:
          type: string
          format: uuid
          description: >
            Если указан и `paid=true`, в той же транзакции списывается
            баланс счёта и создаётся financial_operation
            (type=out, category=stock_purchase, source_ref=receipt:<id>).
            Идемпотентность гарантирована UNIQUE index на (restaurant_id, source_ref).
            Если не указан — приёмка фиксируется без денежной операции
            (поставщик в долг — кредиторка).
        paid:
          type: boolean
          default: true
          description: >
            Если false и `account_id` указан — финоп НЕ создаётся (отметка
            «приёмка сейчас, оплатим потом»).
        lines:
          type: array
          items:
            type: object
            required: [ingredient_id, name, qty, price_per_unit]
            properties:
              ingredient_id: { type: string, format: uuid }
              name: { type: string }
              qty: { $ref: "#/components/schemas/Decimal" }
              unit: { type: string }
              price_per_unit: { $ref: "#/components/schemas/Decimal" }
    StockReceipt:
      type: object
      properties:
        id: { type: string, format: uuid }
        total_amount: { $ref: "#/components/schemas/Decimal" }
        paid_amount: { $ref: "#/components/schemas/Decimal" }
        debt_amount: { $ref: "#/components/schemas/Decimal" }
        returned_total:
          $ref: "#/components/schemas/Decimal"
          description: "Сумма НЕотменённых возвратов поставщику по накладной (при ?include=lines). UI: статус «Возвращено»/«Возврат части»."
        lines:
          type: array
          description: "Только при ?include=lines."
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              ingredient_id: { type: string, nullable: true }
              name: { type: string, nullable: true }
              qty: { $ref: "#/components/schemas/Decimal" }
              unit: { type: string, nullable: true }
              price_per_unit: { $ref: "#/components/schemas/Decimal" }
              available_to_return:
                $ref: "#/components/schemas/Decimal"
                description: >
                  Сколько ещё можно вернуть поставщику по этой строке, В ЕДИНИЦАХ
                  НАКЛАДНОЙ. Считает бэк по тому же правилу, что guard в
                  POST /stock/returns: min(принято − Σ неотменённых возвратов,
                  фактический остаток товара). Клиенту считать это самому нельзя:
                  он не знает про отменённые возвраты и путает единицы склада с
                  единицами накладной.

    ReturnInput:
      type: object
      required: [receipt_id, reason, refund_type, lines]
      description: >
        Возврат поставщику испорченного/битого товара. Зеркало приёмки: склад
        −qty (stock_movements type=return_supplier), откат средневзвешенной
        себестоимости, возврат денег/долга. Не путать со списанием: списание —
        наш убыток и бьёт по прибыли, возврат — сторно закупки.
      properties:
        receipt_id:
          type: string
          format: uuid
          description: >
            Накладная, по которой возвращаем. Цена возврата берётся из её строк,
            а не из средневзвешенной себестоимости склада — поставщик отдаёт
            ровно ту сумму, что взял.
        date: { type: string, description: "YYYY-MM-DD, по умолчанию сегодня" }
        reason: { type: string, enum: [spoilage, breakage, expired, other] }
        note: { type: string }
        refund_type:
          type: string
          enum: [debt, money]
          description: >
            Ветки взаимоисключающие, выбор диктует остаток долга поставщику
            debtRoom = min(receipt.debt_amount, supplier.current_debt).
            debt — долг есть (debtRoom > 0): уменьшаются обе стороны —
            stock_receipts.debt_amount и suppliers.current_debt (RecomputeDebts
            считает current_debt как Σ debt_amount − Σ оплат, поэтому тронуть
            надо обе). 409, если гасить нечего или сумма больше debtRoom
            (смешанный случай — оформить двумя возвратами: на debtRoom в долг,
            остаток деньгами).
            money — долга нет: financial_accounts.balance += сумма и
            financial_operation (type=in, category=stock_purchase). 409, если по
            накладной есть непогашенный долг — иначе получили бы деньги за
            неоплаченный товар и остались должны. Категория stock_purchase, а не
            доход: возврат схлопывается с закупкой, ОПиУ не показывает фейковую
            выручку. Идемпотентность — на Idempotency-Key, не на source_ref.
        account_id:
          type: string
          format: uuid
          description: "Куда пришли деньги. Обязателен при refund_type=money."
        lines:
          type: array
          items:
            type: object
            required: [receipt_line_id, qty]
            properties:
              receipt_line_id:
                type: string
                format: uuid
                description: "Строка накладной. Σ возвратов по ней не может превысить принятое qty (иначе 409)."
              qty: { $ref: "#/components/schemas/Decimal" }
    StockReturn:
      type: object
      properties:
        id: { type: string, format: uuid }
        receipt_id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid, nullable: true }
        supplier_name: { type: string, nullable: true }
        date: { type: string, nullable: true }
        reason: { type: string, enum: [spoilage, breakage, expired, other] }
        note: { type: string, nullable: true }
        total_amount: { $ref: "#/components/schemas/Decimal" }
        refund_type: { type: string, enum: [debt, money] }
        account_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true, description: "Сторно: товар вернулся на склад, деньги/долг откатились" }
        cancelled_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    WriteoffInput:
      type: object
      required: [reason, lines]
      properties:
        reason: { type: string }
        description: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [ingredient_id, name, qty, cost]
            properties:
              ingredient_id: { type: string, format: uuid }
              name: { type: string }
              qty: { $ref: "#/components/schemas/Decimal" }
              unit: { type: string }
              cost: { $ref: "#/components/schemas/Decimal" }
              kind:
                type: string
                enum: [ingredient, semi, batch]
                description: |
                  Тип списываемого. ingredient (по умолчанию) → stock_movement по
                  ingredient_id. semi → декремент semi_finished_stock.qty (id п/ф).
                  batch → декремент menu_items.prepared_qty (id блюда).
    StockWriteoff:
      type: object
