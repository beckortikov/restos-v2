    get:
      tags: [finance]
      summary: Список регулярных платежей (модуль «Платежи»)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringPaymentsList" } } } } }
    post:
      tags: [finance]
      summary: Создать регулярный платёж (шаблон)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringPaymentInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringPayment" } } } } }
  /api/v1/finance/recurring-payments/{id}:
    patch:
      tags: [finance]
      summary: Изменить регулярный платёж
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringPaymentInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringPayment" } } } } }
    delete:
      tags: [finance]
      summary: Удалить регулярный платёж
      parameters: [ { in: path, name: id, required: true, schema: { type: string, format: uuid } } ]
      responses: { "204": { description: No Content } }
  /api/v1/finance/recurring-payments/{id}/pay:
    post:
      tags: [finance]
      summary: Провести платёж по шаблону
      description: |
        Списывает сумму со счёта и создаёт financial_operation out. Сумма/счёт по
        умолчанию из шаблона, но переопределяются в теле (коммуналка меняется
        помесячно). next_due двигается на следующий месяц, ставится last_paid_at.
        Обычный операционный расход (в отличие от гашения долга поставщику).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringPaymentPayInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RecurringPayment" } } } }
        "409":
          description: На счёте недостаточно денег.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

